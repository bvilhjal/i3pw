name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy --ignore-missing-imports src/i3pw
      - name: Test (pytest)
        run: pytest

      - name: Smoke-test the benchmark suite and the figure generator
        # A few replications only: this checks that every benchmark and every
        # generated table and figure still runs end to end. It is far too noisy to
        # quote, and writes to a separate file so it cannot be mistaken for the
        # freeze in report/benchmark_results.tsv.
        run: |
          python -m benchmarks.run_all --quick
          python -m benchmarks.make_figures
          git diff --exit-code -- report/figures report/benchmark_results.tsv

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Check explanatory artifacts in both distributions
        run: |
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          expected = {
              "README.md",
              "LICENSE",
              "CITATION.cff",
              "CHANGELOG.md",
              "report/i3pw_report.tex",
              "report/validation_results.tsv",
              "report/validation_environment.txt",
              "report/benchmark_results.tsv",
              "report/benchmark_environment.txt",
              "benchmarks/README.md",
              *(str(path) for path in Path("docs").glob("*.md")),
              *(str(path) for path in Path("examples").glob("*.py")),
              *(str(path) for path in Path("benchmarks").glob("*.py")),
          }
          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with ZipFile(wheel) as archive:
              wheel_members = archive.namelist()
          with open_tar(sdist, "r:gz") as archive:
              sdist_members = archive.getnames()

          wheel_missing = sorted(
              relative
              for relative in expected
              if not any(
                  member.endswith(f"/share/i3pw/{relative}")
                  for member in wheel_members
              )
          )
          sdist_missing = sorted(
              relative
              for relative in expected
              if not any(member.endswith(f"/{relative}") for member in sdist_members)
          )
          if wheel_missing or sdist_missing:
              raise SystemExit(
                  f"missing from wheel: {wheel_missing}; missing from sdist: {sdist_missing}"
              )
          print(f"checked {len(expected)} artifacts in {wheel.name} and {sdist.name}")
          PY
      - name: Smoke-test an example against the built wheel
        run: |
          python -m pip install dist/*.whl
          python examples/benchmark.py
