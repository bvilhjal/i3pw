[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "i3pw"
version = "0.3.0"
description = "Informed Inference of Inverse Probability Weights: selection-bias correction by calibrating IPW weights to known population prevalences."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Bjarni Vilhjalmsson" }]
keywords = [
    "selection-bias",
    "inverse-probability-weighting",
    "calibration",
    "epidemiology",
    "causal-inference",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/bvilhjal/i3pw"
Documentation = "https://github.com/bvilhjal/i3pw/blob/main/docs/guide.md"
Source = "https://github.com/bvilhjal/i3pw"
Issues = "https://github.com/bvilhjal/i3pw/issues"
Changelog = "https://github.com/bvilhjal/i3pw/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
i3pw = ["py.typed"]

[tool.setuptools.data-files]
"share/i3pw" = ["README.md", "LICENSE", "CITATION.cff", "CHANGELOG.md"]
"share/i3pw/docs" = ["docs/*.md"]
"share/i3pw/examples" = ["examples/*.py"]
"share/i3pw/report" = [
    "report/i3pw_report.tex",
    "report/validation_results.tsv",
    "report/validation_environment.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]  # ambiguous variable names (e.g. l1_mask math) are fine here
